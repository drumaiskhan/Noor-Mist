[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Domain-independent deployment.
# The frontend calls the Railway API directly in production, so a custom
# domain does not depend on Netlify's /api proxy behavior. These proxy
# rules are retained for compatibility with direct /api and /uploads URLs.
# They must remain before the SPA catch-all.
[[redirects]]
  from = "/api/*"
  to = "https://noor-mist-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://noor-mist-production.up.railway.app/uploads/:splat"
  status = 200
  force = true

# React Router SPA fallback -- must stay last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
