[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Optional API/upload proxy retained for compatibility. The frontend production
# build now uses the Railway API directly so custom domains do not depend on
# Netlify proxy behavior.
[[redirects]]
  from = "/api/*"
  to = "https://noor-mist-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://noor-mist-production.up.railway.app/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
