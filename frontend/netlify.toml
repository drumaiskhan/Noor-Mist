[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Same-origin API/upload proxy to the Railway backend — see the root
# netlify.toml for the full explanation. Kept in sync here in case
# Netlify's "base directory" setting causes this file to be picked up
# instead of the one at the repo root. Must come before the SPA
# catch-all below.
[[redirects]]
  from = "/api/*"
  to = "https://noor-mist-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://noor-mist-production.up.railway.app/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
